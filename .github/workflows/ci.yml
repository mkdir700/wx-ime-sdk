name: Build and verify CLI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: windows-2022
            platform: win32-x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Windows OpenSSL build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm strawberryperl --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked --features wxc/vendored-openssl
      - run: cargo build --release --locked -p wxc --features vendored-openssl --target ${{ matrix.target }}
      - name: Assemble platform and launcher packages
        shell: bash
        run: |
          EXE=wxc
          if [ "$RUNNER_OS" = Windows ]; then EXE=wxc.exe; fi
          node scripts/npm-package.mjs build '${{ matrix.platform }}' 'target/${{ matrix.target }}/release/'"$EXE"
      - name: Install tarballs and exercise CLI
        run: node scripts/npm-smoke.mjs
      - name: Stage verified tarballs
        shell: bash
        run: |
          mkdir -p npm-upload
          cp npm-smoke/mkdir700-wxc-${{ matrix.platform }}-*.tgz npm-upload/
          if [ '${{ matrix.platform }}' = linux-x64 ]; then
            cp npm-smoke/mkdir700-wxc-[0-9]*.tgz npm-upload/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: npm-upload/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: npm-smoke/results.json
          if-no-files-found: warn

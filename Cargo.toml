[workspace]
members = ["crates/wx-ime-protocol", "crates/wx-ime-sdk", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
wx-ime-protocol = { path = "crates/wx-ime-protocol", version = "0.1.0" }
wx-ime-sdk = { path = "crates/wx-ime-sdk", version = "0.1.0" }
base64 = "0.22"
blake3 = "1"
fs2 = "0.4"
hex = "0.4"
openssl = "0.10"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[package]
name = "wxc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "WeType (WeChat IME) cross-device clipboard command line client"

[[bin]]
name = "wxc"
path = "src/main.rs"

[features]
default = []
vendored-openssl = ["wx-ime-sdk/vendored-openssl"]

[dependencies]
wx-ime-sdk.workspace = true
if-addrs = "0.13"
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

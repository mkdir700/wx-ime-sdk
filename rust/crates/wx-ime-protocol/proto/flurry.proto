// Observed native gRPC file-transfer messages. Unknown fields remain neutral.
syntax = "proto2";
package flurry;
message FileInfo {
  optional string id = 1;
  optional string name = 2;
  optional uint64 size = 3;
}
message Action {
  optional uint32 kind = 1;
  optional FileInfo file = 2;
}
message FileChunk {
  optional Action action = 1;
  optional bytes data = 2;
  optional uint64 start = 3;
  optional uint64 end = 4;
  optional bytes business = 5;
  optional uint64 field6 = 6;
  optional uint64 field7 = 7;
  optional bytes field8 = 8;
}
service FileService {
  rpc TransferFiles(stream FileChunk) returns (stream FileChunk);
}
